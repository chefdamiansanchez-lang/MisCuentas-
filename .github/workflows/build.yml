
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar proyecto (descomprime el zip si hace falta)
        run: |
          if [ ! -f settings.gradle.kts ]; then
            for z in *.zip; do
              [ -f "$z" ] && unzip -o "$z" -d proyecto_zip && break
            done
          fi
          if [ -f settings.gradle.kts ]; then
            echo "PROYECTO_DIR=." >> "$GITHUB_ENV"
          else
            S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
            if [ -z "$S" ]; then echo "No se encontró el proyecto"; exit 1; fi
            echo "PROYECTO_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: |
          cd "$PROYECTO_DIR"
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MisCuentas.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MisCuentas-APK
          path: MisCuentas.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mis Cuentas v${{ github.run_number }}
          files: MisCuentas.apk
